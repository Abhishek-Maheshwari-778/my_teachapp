name: tutorflow_securenotes
description: "TutorFlow SecureNotes & Mini-LMS - Zero-cost secure learning platform with Android anti-piracy, live lectures, automated attendance, and digital certificates."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # DRM & Anti-Piracy Window Security
  flutter_windowmanager: ^0.2.0

  # Networking & HTTP Redirects
  http: ^1.2.0

  # In-Memory Byte Stream PDF Rendering
  syncfusion_flutter_pdfviewer: ^25.1.35

  # Concealed YouTube Player
  youtube_player_flutter: ^9.0.1

  # Sandbox Local File Management
  path_provider: ^2.1.2

  # Live Video Conferencing (Jitsi Meet SDK)
  jitsi_meet_flutter_sdk: ^10.2.0

  # On-Device Dynamic PDF Certificate Generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # Local Key-Value State
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

  # UI Enhancement Icons & Animations
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

